[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "m4dash"
version = "1.0.0"
description = "Results dashboard for Meta-Memory (M4)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.30.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
m4dash = "m4dash.app:main"

[tool.setuptools.packages.find]
where = ["src"]
