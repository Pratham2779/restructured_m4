[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "m4"
version = "1.0.0"
description = "Meta-Memory for Large Language Models (IEEE TASLP 2026)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
neo4j = ["neo4j>=5.20.0"]
server = ["fastapi>=0.110.0", "uvicorn>=0.29.0"]
local = ["sentence-transformers>=2.6.0", "llmlingua>=0.2.2"]
test = ["pytest>=7.0.0", "pytest-asyncio>=0.21.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
m4 = ["prompts/*.txt"]
