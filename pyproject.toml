[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "m4-workspace"
version = "1.0.0"
description = "M4 long-term memory engine, benchmark harness, and evaluation workspace"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["packages/m4/tests", "packages/m4bench/tests", "benchmarks", "packages/m4dash/tests"]
python_files = ["test_*.py"]
pythonpath = ["packages/m4/src", "packages/m4bench/src", "packages/m4dash/src", "."]
